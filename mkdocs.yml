site_name: Physics Basics
site_description: Classical mechanics refresher notes
site_url: ""
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.footer
    - navigation.top
    - content.tooltips
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - 1. Units & Measurement: 01-Units-and-Measurement.md
  - 2. Vectors: 02-Vectors.md
  - 3. Kinematics: 03-Kinematics.md
  - 4. Newton's Laws: 04-Newtons-Laws.md
  - 5. Work, Energy, Power: 05-Work-Energy-Power.md
  - 6. Momentum & Collisions: 06-Momentum-and-Collisions.md
  - 7. Rotation: 07-Rotation.md
  - 8. Oscillations: 08-Oscillations.md
  - 9. Gravitation: 09-Gravitation.md
  - Image credits: image-credits.md
