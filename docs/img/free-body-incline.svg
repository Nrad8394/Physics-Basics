<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="460" height="320" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <!-- incline triangle -->
  <polygon points="40,280 420,280 420,132" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <!-- angle -->
  <path d="M 110 280 A 70 70 0 0 0 105 253" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="118" y="270" fill="#333" font-size="16" font-style="italic">&#952;</text>
  <!-- block (rotated to sit on slope) -->
  <g transform="rotate(-21.3 220 210)">
    <rect x="185" y="175" width="70" height="35" rx="3" fill="#3f51b5" fill-opacity="0.85"/>
    <text x="207" y="199" fill="#fff" font-size="15" font-style="italic">m</text>
  </g>
  <!-- forces from block centre ~ (226,185) -->
  <!-- N: perpendicular to slope -->
  <line x1="226" y1="185" x2="197" y2="110" stroke="#43a047" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="172" y="103" fill="#43a047" font-size="17" font-weight="bold" font-style="italic">N</text>
  <!-- mg: straight down -->
  <line x1="226" y1="185" x2="226" y2="285" stroke="#e53935" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="234" y="292" fill="#e53935" font-size="17" font-weight="bold" font-style="italic">mg</text>
  <!-- friction: up the slope -->
  <line x1="226" y1="185" x2="295" y2="158" stroke="#fb8c00" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="302" y="152" fill="#fb8c00" font-size="17" font-weight="bold" font-style="italic">f</text>
  <text x="30" y="40" fill="#333" font-size="14">Along slope: mg sin &#952; &#8722; f = ma</text>
  <text x="30" y="62" fill="#333" font-size="14">Perpendicular: N = mg cos &#952;</text>
</svg>
