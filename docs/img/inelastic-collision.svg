<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="520" height="280" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <text x="24" y="34" fill="#333" font-size="15" font-weight="bold">Perfectly inelastic collision (they stick)</text>
  <!-- BEFORE -->
  <text x="24" y="68" fill="#666" font-size="13">before</text>
  <line x1="24" y1="130" x2="496" y2="130" stroke="#9a9aa6" stroke-width="1.5"/>
  <rect x="60" y="90" width="90" height="40" rx="5" fill="#3f51b5"/>
  <text x="76" y="115" fill="#fff" font-size="13">2000 kg</text>
  <line x1="155" y1="110" x2="225" y2="110" stroke="#3f51b5" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="160" y="98" fill="#3f51b5" font-size="13">10 m/s</text>
  <rect x="300" y="95" width="70" height="35" rx="5" fill="#fb8c00"/>
  <text x="308" y="118" fill="#fff" font-size="13">1000 kg</text>
  <text x="382" y="118" fill="#fb8c00" font-size="13">at rest</text>
  <!-- AFTER -->
  <text x="24" y="168" fill="#666" font-size="13">after</text>
  <line x1="24" y1="230" x2="496" y2="230" stroke="#9a9aa6" stroke-width="1.5"/>
  <rect x="200" y="190" width="90" height="40" rx="5" fill="#3f51b5"/>
  <rect x="290" y="195" width="70" height="35" rx="5" fill="#fb8c00"/>
  <line x1="365" y1="210" x2="425" y2="210" stroke="#333" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="368" y="198" fill="#333" font-size="13">6.7 m/s</text>
  <text x="24" y="254" fill="#333" font-size="13">Momentum conserved: 2000&#215;10 = 3000&#215;6.7.</text>
  <text x="24" y="271" fill="#333" font-size="13">Kinetic energy NOT conserved &#8212; &#8531; is lost to deformation.</text>
</svg>
