<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="340" height="320" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <circle cx="170" cy="175" r="105" fill="none" stroke="#9a9aa6" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="170" cy="175" r="4" fill="#333"/>
  <!-- object on circle at 45deg upper right: (244,101) -->
  <circle cx="244" cy="101" r="11" fill="#3f51b5"/>
  <!-- velocity: tangent (perpendicular to radius), pointing up-left -->
  <line x1="244" y1="101" x2="188" y2="45" stroke="#43a047" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="160" y="40" fill="#43a047" font-size="17" font-weight="bold" font-style="italic">v</text>
  <!-- centripetal acceleration: toward centre -->
  <line x1="244" y1="101" x2="196" y2="149" stroke="#e53935" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="196" y="130" fill="#e53935" font-size="15" font-style="italic">a&#7580;</text>
  <!-- radius -->
  <line x1="170" y1="175" x2="244" y2="101" stroke="#333" stroke-width="1.3"/>
  <text x="212" y="152" fill="#333" font-size="14" font-style="italic">r</text>
  <text x="30" y="286" fill="#333" font-size="14">a&#7580; = v&#178;/r &#8594; F = mv&#178;/r, toward the centre</text>
  <text x="30" y="306" fill="#666" font-size="12">speed constant, velocity always changing direction</text>
</svg>
