<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="500" height="250" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <!-- bolt -->
  <circle cx="100" cy="120" r="22" fill="#90a4ae"/>
  <circle cx="100" cy="120" r="10" fill="#eceff1"/>
  <!-- spanner -->
  <rect x="100" y="108" width="320" height="24" rx="10" fill="#3f51b5" fill-opacity="0.8"/>
  <!-- pivot dot -->
  <circle cx="100" cy="120" r="4" fill="#333"/>
  <!-- force at end, perpendicular -->
  <line x1="400" y1="132" x2="400" y2="212" stroke="#e53935" stroke-width="4" marker-end="url(#ar)"/>
  <text x="410" y="180" fill="#e53935" font-size="18" font-weight="bold" font-style="italic">F</text>
  <!-- lever arm r -->
  <line x1="100" y1="80" x2="400" y2="80" stroke="#333" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="240" y="70" fill="#333" font-size="15" font-style="italic">r (lever arm)</text>
  <line x1="100" y1="76" x2="100" y2="106" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="400" y1="76" x2="400" y2="106" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="60" y="226" fill="#333" font-size="14">&#964; = r F sin &#952; &#8212; here &#952; = 90&#176;, so &#964; = rF.</text>
  <text x="60" y="244" fill="#333" font-size="14">Longer spanner or bigger push &#8594; more torque.</text>
</svg>
