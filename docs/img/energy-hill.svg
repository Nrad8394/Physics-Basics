<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif">
  <rect width="560" height="330" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <!-- track: high start, valley, medium second hill -->
  <path d="M 50 90 C 130 90 150 250 250 255 C 330 258 340 160 430 158 L 430 158" fill="none" stroke="#90a4ae" stroke-width="4"/>
  <line x1="50" y1="270" x2="520" y2="270" stroke="#333" stroke-width="1.5"/>
  <!-- carts -->
  <circle cx="52" cy="82" r="9" fill="#3f51b5"/>
  <circle cx="250" cy="247" r="9" fill="#3f51b5"/>
  <circle cx="428" cy="150" r="9" fill="#3f51b5"/>
  <!-- bars: start (all PE) -->
  <g>
    <rect x="80" y="120" width="18" height="100" fill="#43a047"/>
    <rect x="102" y="220" width="18" height="0" fill="#e53935"/>
    <text x="76" y="240" fill="#333" font-size="12">PE  KE</text>
    <text x="70" y="110" fill="#333" font-size="13" font-weight="bold">start: all PE</text>
  </g>
  <!-- bars: valley (all KE) -->
  <g>
    <rect x="222" y="120" width="18" height="0" fill="#43a047"/>
    <rect x="244" y="120" width="18" height="100" fill="#e53935"/>
    <text x="218" y="240" fill="#333" font-size="12">PE  KE</text>
    <text x="200" y="110" fill="#333" font-size="13" font-weight="bold">bottom: all KE</text>
  </g>
  <!-- bars: second hill (split) -->
  <g>
    <rect x="452" y="158" width="18" height="62" fill="#43a047"/>
    <rect x="474" y="182" width="18" height="38" fill="#e53935"/>
    <text x="448" y="240" fill="#333" font-size="12">PE  KE</text>
    <text x="436" y="146" fill="#333" font-size="13" font-weight="bold">part way back</text>
  </g>
  <text x="60" y="300" fill="#333" font-size="14">Green + red always add to the same total &#8212; energy just changes form.</text>
  <text x="60" y="320" fill="#666" font-size="12">with friction, some leaks away as heat and both bars shrink</text>
</svg>
