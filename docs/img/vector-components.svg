<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="460" height="310" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <!-- axes -->
  <line x1="60" y1="260" x2="430" y2="260" stroke="#9a9aa6" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="60" y1="260" x2="60" y2="30" stroke="#9a9aa6" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="435" y="248" fill="#555" font-size="15" font-style="italic">x</text>
  <text x="48" y="28" fill="#555" font-size="15" font-style="italic">y</text>
  <!-- components -->
  <line x1="60" y1="260" x2="340" y2="260" stroke="#e53935" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="340" y1="260" x2="340" y2="90" stroke="#43a047" stroke-width="3.5" marker-end="url(#ar)"/>
  <!-- vector -->
  <line x1="60" y1="260" x2="340" y2="90" stroke="#3f51b5" stroke-width="4" marker-end="url(#ar)"/>
  <!-- angle arc -->
  <path d="M 115 260 A 55 55 0 0 0 107 232" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="122" y="247" fill="#333" font-size="16" font-style="italic">&#952;</text>
  <!-- labels -->
  <text x="185" y="160" fill="#3f51b5" font-size="19" font-weight="bold" font-style="italic">A</text>
  <text x="160" y="283" fill="#e53935" font-size="16" font-style="italic">A<tspan font-size="12" dy="4">x</tspan><tspan dy="-4"> = A cos &#952;</tspan></text>
  <text x="350" y="180" fill="#43a047" font-size="16" font-style="italic">A<tspan font-size="12" dy="4">y</tspan><tspan dy="-4"> = A sin &#952;</tspan></text>
  <text x="70" y="52" fill="#333" font-size="14">A = &#8730;(Ax&#178; + Ay&#178;)</text>
  <text x="70" y="72" fill="#333" font-size="14">tan &#952; = Ay / Ax</text>
</svg>
