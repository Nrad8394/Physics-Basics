<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="400" height="300" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <text x="20" y="34" fill="#333" font-size="15" font-weight="bold">Tip-to-tail addition</text>
  <!-- 3 m east -->
  <line x1="80" y1="250" x2="200" y2="250" stroke="#e53935" stroke-width="4" marker-end="url(#ar)"/>
  <text x="115" y="274" fill="#e53935" font-size="15">3 m east</text>
  <!-- 4 m north -->
  <line x1="200" y1="250" x2="200" y2="90" stroke="#43a047" stroke-width="4" marker-end="url(#ar)"/>
  <text x="210" y="170" fill="#43a047" font-size="15">4 m north</text>
  <!-- resultant -->
  <line x1="80" y1="250" x2="196" y2="96" stroke="#3f51b5" stroke-width="4" stroke-dasharray="none" marker-end="url(#ar)"/>
  <text x="80" y="150" fill="#3f51b5" font-size="15" font-weight="bold">5 m</text>
  <path d="M 120 250 A 40 40 0 0 0 112 218" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="126" y="238" fill="#333" font-size="13">53&#176;</text>
  <text x="20" y="60" fill="#666" font-size="13">magnitudes don&#8217;t add: 3 + 4 = 5 here</text>
</svg>
