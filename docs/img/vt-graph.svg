<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" font-family="sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="480" height="310" rx="8" fill="#ffffff" stroke="#d0d0d8"/>
  <!-- shaded area under line -->
  <polygon points="70,260 70,190 370,110 370,260" fill="#3f51b5" fill-opacity="0.15"/>
  <!-- axes -->
  <line x1="70" y1="260" x2="440" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="70" y1="260" x2="70" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="445" y="250" fill="#333" font-size="15" font-style="italic">t</text>
  <text x="55" y="38" fill="#333" font-size="15" font-style="italic">v</text>
  <!-- v(t) line -->
  <line x1="70" y1="190" x2="370" y2="110" stroke="#3f51b5" stroke-width="3.5"/>
  <!-- v0 marker -->
  <text x="40" y="195" fill="#3f51b5" font-size="14" font-style="italic">v&#8320;</text>
  <!-- slope callout -->
  <line x1="220" y1="150" x2="290" y2="150" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="290" y1="150" x2="290" y2="131" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="238" y="98" fill="#e53935" font-size="14">slope = acceleration</text>
  <line x1="280" y1="105" x2="268" y2="132" stroke="#e53935" stroke-width="1.2" marker-end="url(#ar)"/>
  <!-- area label -->
  <text x="130" y="225" fill="#3f51b5" font-size="15" font-weight="bold">area = displacement</text>
  <text x="70" y="292" fill="#666" font-size="13">constant acceleration: trapezoid area = &#189;(v&#8320;+v)t = &#916;x</text>
</svg>
